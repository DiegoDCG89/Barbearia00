<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090706">
<meta name="robots" content="noindex, nofollow">
<title>Painel · {{ shop.name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Painel — mesma identidade do site (Noir): fundo quase preto quente, dourado, Cormorant + Manrope */
:root{color-scheme:dark;--bg:#090706;--card:#110f0d;--ink:#ede7dd;--mute:#938b7f;--line:#2d2823;--gold:#d7a85b;--gold-d:#af7940;
--grad:linear-gradient(120deg,#af7940,#efcc83,#bd853f);--on-gold:#090706;--sec:#1b1715;
--ok:#6fd3a0;--okbg:rgba(111,211,160,.1);--bad:#ff8a80;--badbg:rgba(222,60,55,.13);--warn:#d7a85b;--warnbg:rgba(215,168,91,.1);--r:4px;
--display:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:var(--on-gold)}
header{background:rgba(9,7,6,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1000px;margin:auto;padding:12px 14px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.65rem;line-height:1;letter-spacing:.02em}
.brand small{font-family:var(--sans);font-size:.65rem;color:var(--mute);font-weight:500;letter-spacing:.3em;text-transform:uppercase;margin-left:.4rem}
.sp{flex:1}
.lnk{font-size:11px;color:var(--mute);text-decoration:none;padding:4px 6px;text-transform:uppercase;letter-spacing:.2em;transition:color .2s}
.lnk:hover{color:var(--gold)}
nav{max-width:1000px;margin:auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--mute);font:700 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.22em;padding:14px 12px;cursor:pointer;white-space:nowrap;transition:color .2s}
nav button:hover{color:var(--gold)}
nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:1000px;margin:auto;padding:22px 14px 70px}
h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1;margin:30px 0 14px}
h2:first-child{margin-top:4px}
h3{font-family:var(--display);font-weight:400;font-size:1.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-family:var(--display);font-size:2.2rem;font-weight:400;line-height:1.1;margin-top:2px}
.kpi .l{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.25em;font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.btn{border:1px solid transparent;background:var(--grad);color:var(--on-gold);font:700 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.2em;padding:12px 18px;border-radius:0;cursor:pointer;transition:transform .2s,border-color .2s,color .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:9px 12px;font-size:10px;letter-spacing:.16em}
.btn.gold{background:var(--grad);color:var(--on-gold)}
.btn.red{background:transparent;color:var(--bad);border-color:rgba(255,138,128,.5)}
.btn.red:hover{background:var(--badbg)}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;max-width:100%;color-scheme:dark;transition:border-color .2s}
select option{background:var(--card);color:var(--ink)}
input::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.btn:focus-visible,nav button:focus-visible,.lnk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);margin-bottom:12px}
label input,label select,label textarea{display:block;width:100%;margin-top:6px;color:var(--ink);text-transform:none;letter-spacing:normal;font-weight:400}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);text-transform:none;letter-spacing:normal;font-size:13px;font-weight:500}
label.chk input{width:auto;margin:0;accent-color:var(--gold)}
.muted{color:var(--mute)}
.text-gold-gradient{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.italic{font-style:italic}
.cap{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);margin-bottom:6px}
.big{font-family:var(--display);font-size:2rem;font-weight:400;line-height:1}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:0;border:1px solid var(--line);background:transparent;color:var(--mute);vertical-align:middle}
.pill.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}.pill.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg)}.pill.warn{border-color:var(--gold);color:var(--gold);background:var(--warnbg)}
.appt{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.appt .t{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;color:var(--gold);min-width:92px}
.appt .i{flex:1;min-width:180px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--mute);background:var(--sec);font-weight:700}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(255,255,255,.02)}
td.n,th.n{text-align:right;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--grad);border-radius:0;min-height:2px;opacity:.8}
.bars div:hover{opacity:1}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.alert{background:var(--warnbg);color:var(--warn);border:1px solid rgba(215,168,91,.35);border-radius:var(--r);padding:11px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:22px;width:min(440px,calc(100vw - 24px));box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(9,7,6,.85);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
dialog h3{margin:0 0 14px;font-size:1.9rem;font-weight:300;line-height:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--grad);color:var(--on-gold);padding:12px 18px;border-radius:0;font:700 12px/1.3 var(--sans);letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:#de3c37;color:#fff}
.hrs input[type=time]{width:100%;min-width:92px}
@media (prefers-reduced-motion:reduce){.btn,.btn:hover,#toast{transition:none;transform:none}}
@media (max-width:560px){.top{gap:6px}.kpi .v{font-size:1.9rem}h2{font-size:1.7rem}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">{% include '_logo.html' %} <small>· painel</small></div>
    <div class="sp"></div>
    <span class="muted" style="font-size:13px">{{ eu.nome }}</span>
    <a class="lnk" href="/minha-conta">Minha conta</a>
    <a class="lnk" href="/" target="_blank" rel="noopener">Ver site</a>
    <a class="lnk" id="l-fin" href="#" target="_blank" rel="noopener" hidden>Planilha financeira</a>
    <a class="lnk" id="l-est" href="#" target="_blank" rel="noopener" hidden>Planilha de estoque</a>
    <a class="lnk" id="l-age" href="#" target="_blank" rel="noopener" hidden>Google Agenda</a>
    <a class="lnk" href="/logout">Sair</a>
  </div>
  <nav id="nav" aria-label="Seções">
    <button data-tab="agenda">Agenda</button>
    <button data-tab="caixa">Caixa</button>
    <button data-tab="resumo">Resumo</button>
    <button data-tab="lanc">Lançamentos</button>
    <button data-tab="despesas">Despesas</button>
    <button data-tab="estoque">Estoque</button>
    <button data-tab="cad">Cadastros</button>
    <button data-tab="horarios">Horários</button>
    <button data-tab="usuarios">Usuários</button>

</header>
<main id="view" aria-live="polite"></main>
<dialog id="dlg"><h3 id="dlgtitle"></h3><form id="dlgform" method="dialog"></form></dialog>
<div id="toast" role="status"></div>

<script>const SHOP = {{ {'name': shop.name, 'address': shop.address}|tojson }};</script>
{% raw %}
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const hoje = () => new Date().toLocaleDateString('en-CA', {timeZone: 'America/Sao_Paulo'});
const fdata = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const FORMAS = {dinheiro: 'Dinheiro', pix: 'Pix', debito: 'Débito', credito: 'Crédito'};
const DIAS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const S = {day: hoje(), month: hoje().slice(0, 7), tab: 'agenda', noForma: false, tx: [], prod: [], barbers: null, links: {}};
const view = $('#view');

// ------------------------------------------------------------ utilidades
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? 4500 : 2200);
}
async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (r.status === 401) { location.href = '/entrar?next=/admin'; throw new Error('Sessão expirada'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erro inesperado.');
  return d;
}
// executa uma ação, avisa o resultado e recarrega a aba
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); await show(S.tab, true); }
  catch (e) { toast(e.message, true); }
}
const options = (pairs, sel) => pairs.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const formaOpts = (sel, vazio) => options((vazio ? [['', vazio]] : []).concat(Object.entries(FORMAS)), sel);
async function barbers() { return S.barbers || (S.barbers = await api('/api/admin/barbers')); }

// diálogo de formulário genérico: devolve os valores ou null (cancelou)
function ask({title, fields, values = {}, ok = 'Salvar'}) {
  return new Promise(resolve => {
    const dlg = $('#dlg'), f = $('#dlgform'); let done = false;
    const itens = {};  // campos do tipo 'items': linhas [{id, q}]
    $('#dlgtitle').textContent = title;
    f.innerHTML = fields.map(fd => {
      const v = values[fd.k] ?? fd.def ?? '', req = fd.req ? ' required' : '';
      if (fd.type === 'select') return `<label>${esc(fd.label)}<select name="${fd.k}"${req}>${options(fd.opts, v)}</select></label>`;
      if (fd.type === 'items') return `<div class="field" data-items="${esc(fd.k)}" style="margin-bottom:14px"><span class="cap">${esc(fd.label)}</span>
        <div class="row"><select class="it-sel" style="flex:1;min-width:0" aria-label="Produto">${options([['', 'Escolher produto…']].concat(fd.opts), '')}</select>
        <input class="it-qty" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Quantidade" style="width:70px">
        <button type="button" class="btn sm ghost it-add">Adicionar</button></div><div class="it-list"></div></div>`;
      if (fd.type === 'check') return `<label class="chk"><input type="checkbox" name="${fd.k}"${v === true || v === 'sim' ? ' checked' : ''}> ${esc(fd.label)}</label>`;
      const ex = fd.type === 'number' ? ` inputmode="decimal" step="${fd.step || '0.01'}"${fd.min !== undefined ? ` min="${fd.min}"` : ''}` : ` maxlength="${fd.max || 120}"`;
      return `<label>${esc(fd.label)}<input type="${fd.type === 'number' ? 'number' : fd.type || 'text'}" name="${fd.k}" value="${esc(v)}"${req}${ex}></label>`;
    }).join('') + `<div class="row end"><button type="button" class="btn ghost" id="dlgx">Cancelar</button><button class="btn">${esc(ok)}</button></div>`;
    const finish = val => { if (!done) { done = true; resolve(val); } };
    fields.filter(fd => fd.type === 'items').forEach(fd => { itens[fd.k] = []; });
    const pintar = k => {
      const box = f.querySelector(`[data-items="${k}"] .it-list`), l = itens[k], cat = fields.find(x => x.k === k).catalog;
      box.innerHTML = l.length ? l.map(i => `<div class="row" style="justify-content:space-between;margin-top:8px"><span>${esc(cat[i.id].nome)} × ${i.q}</span>
        <span><b>${brl(cat[i.id].preco * i.q)}</b> <button type="button" class="btn sm red it-del" data-p="${esc(i.id)}" aria-label="Remover">×</button></span></div>`).join('')
        + `<div class="row" style="justify-content:flex-end;margin-top:8px"><span class="muted">Produtos:</span> <b>${brl(l.reduce((t, i) => t + cat[i.id].preco * i.q, 0))}</b></div>` : '';
    };
    f.onclick = e => {
      const wrap = e.target.closest('[data-items]'); if (!wrap) return;
      const k = wrap.dataset.items, cat = fields.find(x => x.k === k).catalog;
      if (e.target.closest('.it-add')) {
        const id = wrap.querySelector('.it-sel').value, q = Math.max(1, parseInt(wrap.querySelector('.it-qty').value, 10) || 1);
        if (!id) return;
        const ex = itens[k].find(i => i.id === id), novo = (ex ? ex.q : 0) + q;
        if (novo > cat[id].estoque) { toast(`Só há ${cat[id].estoque} em estoque.`, true); return; }
        if (ex) ex.q = novo; else itens[k].push({id, q});
        wrap.querySelector('.it-qty').value = 1; wrap.querySelector('.it-sel').value = ''; pintar(k);
      }
      const del = e.target.closest('.it-del');
      if (del) { itens[k] = itens[k].filter(i => i.id !== del.dataset.p); pintar(k); }
    };
    f.onkeydown = e => {  // Enter na quantidade adiciona o produto (não conclui o diálogo sem querer)
      if (e.key === 'Enter' && e.target.classList.contains('it-qty')) { e.preventDefault(); e.target.closest('[data-items]').querySelector('.it-add').click(); }
    };
    f.onsubmit = e => {
      e.preventDefault();
      const out = {};
      fields.forEach(fd => {
        if (fd.type === 'items') { out[fd.k] = itens[fd.k].map(i => ({product: i.id, quantidade: i.q})); return; }
        const el = f.elements[fd.k]; out[fd.k] = fd.type === 'check' ? el.checked : el.value;
      });
      finish(out); dlg.close();
    };
    $('#dlgx').onclick = () => dlg.close();
    dlg.onclose = () => finish(null);
    dlg.showModal();
    const first = f.querySelector('input,select'); if (first) first.focus();
  });
}

// ------------------------------------------------------------ MENSAGENS (WhatsApp) — escolhendo o barbeiro
const fmtTel = t => { t = String(t || '').replace(/\D/g, ''); return t.length === 11 ? `(${t.slice(0, 2)}) ${t.slice(2, 7)}-${t.slice(7)}` : t.length === 10 ? `(${t.slice(0, 2)}) ${t.slice(2, 6)}-${t.slice(6)}` : t; };
const primeiro = n => String(n || '').trim().split(/\s+/)[0] || '';
const diaTxt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: '2-digit'});
const maisDia = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
const assinatura = b => `\n\n— ${b ? b.nome + ', ' : ''}${SHOP.name}${b && b.telefone ? '\nWhatsApp: ' + fmtTel(b.telefone) : ''}`;

// ctx: {para: 'cliente'|'barbeiro', nome, tel (cliente), barbeiroId, appt, data}
async function abrirMensagem(ctx) {
  const bs = (await barbers()).filter(b => b.ativo), cli = ctx.para === 'cliente', ap = ctx.appt || null, iso = ctx.data || S.day;
  if (!cli && !bs.length) return toast('Cadastre um barbeiro primeiro (aba Cadastros).', true);
  let barb = bs.find(b => b.id === ctx.barbeiroId) || bs.find(b => b.telefone) || bs[0] || null;
  const nome = primeiro(ctx.nome), quando = ap ? `${diaTxt(iso)} às ${ap.hora}` : '';
  const MOD = cli
    ? [...(ap ? [['lembrete', 'Lembrete do horário'], ['confirmacao', 'Confirmação do horário'], ['remarcar', 'Pedir para remarcar']] : []),
       ['pos', 'Pós-atendimento'], ['volta', 'Chamar de volta'], ['livre', 'Mensagem livre']]
    : [['hoje', 'Agenda de hoje'], ['amanha', 'Agenda de amanhã'], ...(ap ? [['cliente', 'Dados deste cliente']] : []), ['livre', 'Mensagem livre']];
  const gerar = async modelo => {
    switch (modelo) {
      case 'lembrete': return `Olá, ${nome}! Passando para lembrar do seu horário na ${SHOP.name}: ${ap.servico} com ${ap.barbeiro}, ${quando}.${SHOP.address ? '\nEndereço: ' + SHOP.address + '.' : ''}\nSe precisar remarcar, é só me avisar por aqui.` + assinatura(barb);
      case 'confirmacao': return `Olá, ${nome}! Seu horário está confirmado: ${ap.servico} com ${ap.barbeiro}, ${quando}. Te esperamos!` + assinatura(barb);
      case 'remarcar': return `Olá, ${nome}! Preciso ajustar o seu horário de ${quando}. Podemos remarcar? Me diga qual horário fica melhor para você.` + assinatura(barb);
      case 'pos': return `Olá, ${nome}! Foi um prazer te atender. Qualquer ajuste no corte, é só me chamar. Até a próxima!` + assinatura(barb);
      case 'volta': return `Olá, ${nome}! Faz um tempo que você não passa por aqui. Quer agendar um horário? ${location.origin}` + assinatura(barb);
      case 'hoje': case 'amanha': {
        const dia = modelo === 'hoje' ? hoje() : maisDia(hoje(), 1);
        const l = (await api('/api/admin/appointments?day=' + dia)).filter(a => a.barbeiro_id === barb.id && a.status !== 'faltou');
        return `Olá, ${primeiro(barb.nome)}! Sua agenda de ${diaTxt(dia)} na ${SHOP.name}:\n` + (l.length ? l.map(a => `${a.hora} – ${a.cliente} (${a.servico})`).join('\n') : 'Sem horários marcados.');
      }
      case 'cliente': return `Olá, ${primeiro(barb.nome)}! Cliente ${ap.cliente}${ap.telefone ? ' (' + fmtTel(ap.telefone) + ')' : ''}: ${ap.servico}, ${quando}.`;
      default: return cli ? `Olá, ${nome}!` + assinatura(barb) : `Olá, ${primeiro(barb.nome)}! `;
    }
  };
  const dlg = $('#dlg'), f = $('#dlgform');
  $('#dlgtitle').textContent = cli ? 'Mensagem para ' + (ctx.nome || 'cliente') : 'Mensagem para o barbeiro';
  f.onclick = f.onkeydown = dlg.onclose = null; f.onsubmit = e => { e.preventDefault(); dlg.close(); };
  const bopts = bs.map(b => [b.id, b.nome + (b.telefone ? ' · ' + fmtTel(b.telefone) : ' · sem WhatsApp')]);
  f.innerHTML = `<label>${cli ? 'Assinar como (barbeiro)' : 'Barbeiro (destinatário)'}<select id="mb">${options(cli ? [['', 'Sem assinatura de barbeiro']].concat(bopts) : bopts, barb ? barb.id : '')}</select></label>
    <label>Modelo<select id="mm">${options(MOD, MOD[0][0])}</select></label>
    <label>Mensagem<textarea id="mt" rows="8"></textarea></label>
    <p class="muted" id="mh" style="font-size:12px;margin:-4px 0 12px"></p>
    <div class="row end"><button type="button" class="btn ghost" id="mx">Fechar</button>
      <a class="btn" id="mw" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Abrir WhatsApp</a></div>`;
  const destino = () => cli ? String(ctx.tel || '').replace(/\D/g, '') : (barb ? barb.telefone : '');
  const atualizar = () => {
    const tel = destino(), a = $('#mw');

async function show(tab, quiet) {
  S.tab = tab; history.replaceState(null, '', '#' + tab);

      <td>${b.calendario ? '<span class="pill ok">sim</span>' : '<span class="muted">usa a agenda padrão</span>'}</td>
      <td class="n"><button class="btn sm ghost" data-act="editbarb" data-id="${esc(b.id)}">Editar</button></td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:13px">Itens inativos somem do site, mas o histórico continua. Antes de inativar um barbeiro, confira se ele não tem horários marcados.</p>`;
}
const servFields = [{k: 'nome', label: 'Nome', req: true, max: 60}, {k: 'descricao', label: 'Descrição', max: 160},
  {k: 'minutos', label: 'Duração (minutos)', type: 'number', step: '5', min: 5, req: true}, {k: 'preco', label: 'Preço (R$)', type: 'number', min: 0, req: true},
  {k: 'ativo', label: 'Ativo no site', type: 'check'}];
const barbFields = [{k: 'nome', label: 'Nome', req: true, max: 60}, {k: 'funcao', label: 'Função (ex.: Barbeiro)', max: 60},
  {k: 'telefone', label: 'WhatsApp do barbeiro, com DDD (aparece no site para o cliente chamar)', type: 'tel', max: 20},
  {k: 'calendario', label: 'ID da agenda do barbeiro (vazio = agenda padrão)', max: 200}, {k: 'ativo', label: 'Ativo no site', type: 'check'}];

// ------------------------------------------------------------ HORÁRIOS E FOLGAS
async function loadHorarios() {
  const bs = await barbers(), b = S.hb || '*';
  const [hs, folgas] = await Promise.all([api('/api/admin/hours?barber=' + encodeURIComponent(b)), api('/api/admin/timeoff')]);
  const nome = id => id === '*' ? 'Todos' : (bs.find(x => x.id === id) || {nome: id}).nome;
  view.innerHTML = `<h2>Expediente semanal</h2>
    <div class="bar"><select id="hb" aria-label="Barbeiro">${options([['*', 'Horário geral (todos)']].concat(bs.filter(x => x.ativo).map(x => [x.id, x.nome])), b)}</select></div>
    <div class="tbl hrs"><table><thead><tr><th>Dia</th><th>Abre</th><th>Fecha</th><th>Almoço de</th><th>até</th></tr></thead><tbody>
    ${hs.map((h, i) => `<tr><td>${DIAS[i]}</td>${['abre', 'fecha', 'almoco_ini', 'almoco_fim'].map(k => `<td><input type="time" data-i="${i}" data-k="${k}" value="${esc(h[k])}" aria-label="${DIAS[i]} ${k}"></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="font-size:13px">Deixe “abre” e “fecha” vazios para o dia ficar fechado. Um barbeiro com horário próprio ignora o horário geral.</p>
    <button class="btn" data-act="savehours">Salvar horários</button>
    <h2>Folgas, feriados e bloqueios <button class="btn sm" data-act="newoff" style="margin-left:8px">+ Nova</button></h2>
    <div class="tbl"><table><thead><tr><th>Data</th><th>Quem</th><th>Período</th><th>Motivo</th><th></th></tr></thead><tbody>
    ${folgas.map(f => `<tr><td>${fdata(f.data)}/${f.data.slice(0, 4)}</td><td>${esc(nome(f.barbeiro))}</td><td>${f.inicio ? esc(f.inicio) + '–' + esc(f.fim) : 'dia todo'}</td><td>${esc(f.motivo)}</td>
      <td class="n"><button class="btn sm red" data-act="deloff" data-row="${f.row}" data-d="${esc(f.data)}">Remover</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nenhuma folga futura.</td></tr>'}</tbody></table></div>`;
}

// ------------------------------------------------------------ SITE
async function loadSite() {
  const c = await api('/api/admin/config');
  view.innerHTML = `<h2>Dados exibidos no site</h2><form class="card" id="siteform">
    <label>Nome da barbearia<input name="nome" value="${esc(c.nome)}" maxlength="120" required></label>
    <div class="grid"><label>Nome curto (cabeçalho)<input name="nome_curto" value="${esc(c.nome_curto)}" maxlength="40"></label>
    <label>Marca do logo (até 6 letras)<input name="marca" value="${esc(c.marca)}" maxlength="6"></label></div>
    <label>Endereço<input name="endereco" value="${esc(c.endereco)}" maxlength="200"></label>
    <div class="grid"><label>WhatsApp (com DDD)<input name="whatsapp" value="${esc(c.whatsapp)}" inputmode="tel" maxlength="20"></label>
    <label>Instagram (sem @)<input name="instagram" value="${esc(c.instagram)}" maxlength="60"></label></div>
    <label>Descrição<textarea name="descricao" rows="2" maxlength="300">${esc(c.descricao)}</textarea></label>
    <label>Intervalo entre horários (minutos)<input name="intervalo_min" type="number" min="5" max="120" step="5" value="${esc(c.intervalo_min)}"></label>
    <button class="btn">Salvar</button></form>
    <p class="muted" style="font-size:13px">As mudanças aparecem no site em até 1 minuto.</p>`;
}

// ------------------------------------------------------------ CAIXA (venda avulsa de produtos)
S.cart = [];
async function loadCaixa() {
  const [prods, bs, tx] = await Promise.all([api('/api/admin/products'), barbers(), api('/api/admin/transactions?month=' + hoje().slice(0, 7))]);
  S.prod = prods; S.bs = bs; S.vendasHoje = tx.filter(t => t.categoria === 'produto' && t.data === hoje());
  renderCaixa();
}
function renderCaixa() {
  const disp = S.prod.filter(p => p.ativo && p.estoque > 0), cat = Object.fromEntries(S.prod.map(p => [p.id, p]));
  S.cart = S.cart.filter(i => cat[i.id]);
  const total = S.cart.reduce((t, i) => t + cat[i.id].preco * i.q, 0);
  view.innerHTML = `<h2>Venda de produtos</h2>
    <div class="card">
      <span class="cap">Adicionar à venda</span>
      <div class="row"><select id="cp" aria-label="Produto" style="flex:1;min-width:200px">${options([['', disp.length ? 'Escolher produto…' : 'Nenhum produto em estoque']].concat(disp.map(p => [p.id, `${p.nome} · ${brl(p.preco)} (${p.estoque} un.)`])), '')}</select>
        <input id="cq" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Quantidade" style="width:76px">
        <button class="btn" data-act="cart-add">Adicionar</button></div>
      ${S.cart.length ? `<div class="tbl" style="margin-top:14px"><table style="min-width:0"><tbody>${S.cart.map(i => `<tr><td>${esc(cat[i.id].nome)}</td><td class="n">× ${i.q}</td><td class="n">${brl(cat[i.id].preco * i.q)}</td>
          <td class="n"><button class="btn sm red" data-act="cart-del" data-id="${esc(i.id)}" aria-label="Remover">×</button></td></tr>`).join('')}</tbody></table></div>
        <div class="row" style="justify-content:space-between;margin:16px 0 6px"><span class="cap" style="margin:0">Total</span><span class="big">${brl(total)}</span></div>
        <div class="grid" style="margin-top:10px"><label>Forma de pagamento<select id="cf">${formaOpts('pix')}</select></label>
          <label>Vendido por (opcional)<select id="cv">${options([['', '—']].concat(S.bs.filter(b => b.ativo).map(b => [b.nome, b.nome])), '')}</select></label></div>
        <button class="btn" data-act="cart-fin" style="width:100%;padding:15px">Finalizar venda · ${brl(total)}</button>`
        : '<p class="muted" style="margin:14px 0 0">Adicione os produtos da venda. Para vender junto com um corte, use “Concluir” na Agenda.</p>'}
    </div>
    <h2>Vendas de produtos hoje</h2>
    <div class="tbl"><table><thead><tr><th>Produto</th><th>Forma</th><th class="n">Valor</th></tr></thead><tbody>
      ${S.vendasHoje.map(t => `<tr><td>${esc(t.descricao)}${t.barbeiro ? `<div class="muted" style="font-size:12px">${esc(t.barbeiro)}</div>` : ''}</td><td>${esc(FORMAS[t.forma_pgto] || '—')}</td><td class="n pos">${brl(t.valor)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Nenhuma venda de produto hoje.</td></tr>'}
    </tbody></table></div>`;
}

// ------------------------------------------------------------ USUÁRIOS
async function loadUsuarios() {
  S.users = await api('/api/admin/users');
  view.innerHTML = `<div class="bar"><input type="search" id="qusers" placeholder="Buscar por nome, e-mail ou telefone" style="flex:1;min-width:200px" aria-label="Buscar usuário"></div>
    <div id="ulist"></div>
    <p class="muted" style="font-size:13px"><b>Cliente</b> vê só a própria agenda e histórico. <b>Barbeiro</b> acessa este painel inteiro, inclusive o financeiro e esta tela. Dê esse acesso só a quem é da equipe. Quem se cadastra no site entra como cliente.</p>`;
  renderUsuarios();
}
function renderUsuarios() {
  const q = ($('#qusers') ? $('#qusers').value : '').trim().toLowerCase(), digitos = q.replace(/\D/g, '');
  const l = S.users.filter(u => !q || (u.nome || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || (digitos && (u.telefone || '').includes(digitos)));
  $('#ulist').innerHTML = l.map(u => `<div class="card appt" style="${u.ativo ? '' : 'opacity:.6'}">
      <div class="i"><b>${esc(u.nome)}</b> ${u.papel === 'barbeiro' ? '<span class="pill warn">barbeiro</span>' : '<span class="pill">cliente</span>'}${u.ativo ? '' : ' <span class="pill bad">desativado</span>'}${u.voce ? ' <span class="pill ok">você</span>' : ''}<br>
        <span class="muted">${esc(u.telefone)}${u.email ? ' · ' + esc(u.email) : ''}${u.criado_em ? ' · desde ' + esc(u.criado_em.split('-').reverse().join('/')) : ''}</span></div>
      ${u.voce ? '' : `<div class="row">
        <button class="btn sm ghost" data-act="u-papel" data-id="${esc(u.id)}" data-p="${u.papel === 'barbeiro' ? 'cliente' : 'barbeiro'}">${u.papel === 'barbeiro' ? 'Tornar cliente' : 'Tornar barbeiro'}</button>
        <button class="btn sm ghost" data-act="m-cli" data-id="${esc(u.id)}">Mensagem</button>
        <button class="btn sm ghost" data-act="u-link" data-id="${esc(u.id)}">Link de senha</button>
        <button class="btn sm ghost" data-act="u-senha" data-id="${esc(u.id)}">Senha temporária</button>
        <button class="btn sm ${u.ativo ? 'red' : ''}" data-act="u-ativo" data-id="${esc(u.id)}" data-v="${u.ativo ? '0' : '1'}">${u.ativo ? 'Desativar' : 'Reativar'}</button></div>`}</div>`).join('') || '<p class="muted">Nenhum usuário encontrado.</p>';
}

const LOAD = {despesas: loadDespesas, mensagens: loadMensagens, caixa: loadCaixa, usuarios: loadUsuarios, agenda: loadAgenda, resumo: loadResumo, lanc: loadLanc, estoque: loadEstoque, cad: loadCad, horarios: loadHorarios, site: loadSite};

// ------------------------------------------------------------ eventos
view.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset, act = d.act;
  if (act === 'retry') return show(S.tab);
  if (act === 'day') { const dt = new Date(S.day + 'T12:00:00'); if (+d.n) dt.setDate(dt.getDate() + +d.n); else return (S.day = hoje(), show('agenda')); S.day = dt.toLocaleDateString('en-CA'); return show('agenda'); }
  if (act === 'done') {
    let prods = [];
    try { prods = (await api('/api/admin/products')).filter(p => p.ativo && p.estoque > 0); } catch (_) { /* sem produtos: conclui só o serviço */ }
    const v = await ask({title: 'Concluir atendimento', ok: 'Concluir', values: {method: 'pix', discount: '', tip: ''}, fields: [
      {k: 'method', label: 'Forma de pagamento', type: 'select', req: true, opts: Object.entries(FORMAS)},
      {k: 'discount', label: `Desconto (R$) — serviço: ${brl(d.preco)}`, type: 'number', min: 0},
      {k: 'tip', label: 'Gorjeta (R$), entra à parte', type: 'number', min: 0},
      ...(prods.length ? [{k: 'products', label: 'Produtos vendidos junto (opcional)', type: 'items',
        opts: prods.map(p => [p.id, `${p.nome} · ${brl(p.preco)} (${p.estoque} un.)`]), catalog: Object.fromEntries(prods.map(p => [p.id, p]))}] : [])]});
    if (v) run(() => api(`/api/admin/appointments/${encodeURIComponent(d.code)}/status`, {status: 'concluido', ...v}), 'Atendimento concluído');
  }
  if (act === 'miss' && confirm('Marcar que o cliente faltou? O horário volta a ficar livre.')) run(() => api(`/api/admin/appointments/${encodeURIComponent(d.code)}/status`, {status: 'faltou'}), 'Marcado como faltou');
  if (act === 'cancel' && confirm('Cancelar este agendamento? O evento será apagado da agenda.')) run(() => api(`/api/admin/appointments/${encodeURIComponent(d.code)}/status`, {status: 'cancelado'}), 'Agendamento cancelado');
  if (act === 'semforma') { S.noForma = true; return show('lanc'); }
  if (act === 'u-papel' && confirm(d.p === 'barbeiro' ? 'Dar acesso de BARBEIRO a este usuário? Ele poderá ver o painel inteiro, inclusive o financeiro.' : 'Voltar este usuário para cliente? Ele perde o acesso ao painel.'))
    return run(() => api('/api/admin/users/' + encodeURIComponent(d.id), {papel: d.p}), 'Nível de acesso atualizado');
  if (act === 'u-ativo' && confirm(d.v === '1' ? 'Reativar esta conta?' : 'Desativar esta conta? A pessoa sai do site na hora e não consegue entrar nem agendar.'))
    return run(() => api('/api/admin/users/' + encodeURIComponent(d.id), {ativo: d.v === '1'}), d.v === '1' ? 'Conta reativada' : 'Conta desativada');
  if (act === 'u-link') {
    try { await mostrarLink(await api('/api/admin/users/' + encodeURIComponent(d.id) + '/link', {})); }
    catch (err) { toast(err.message, true); }
    return;
  }
  if (act === 'u-senha' && confirm('Gerar uma senha temporária? A senha atual deixa de funcionar e a pessoa sai dos aparelhos conectados.')) {
    try { const r = await api('/api/admin/users/' + encodeURIComponent(d.id) + '/senha', {}); prompt('Senha temporária (copie e envie à pessoa; ela pode trocar em "Minha conta"):', r.senha); }
    catch (err) { toast(err.message, true); }
    return;
  }
  if (act === 'cart-add') {
    const id = $('#cp').value, q = Math.max(1, parseInt($('#cq').value, 10) || 1);
    if (!id) return toast('Escolha um produto.', true);
    const p = S.prod.find(x => x.id === id), ex = S.cart.find(i => i.id === id), novo = (ex ? ex.q : 0) + q;
    if (novo > p.estoque) return toast(`Só há ${p.estoque} em estoque.`, true);
    if (ex) ex.q = novo; else S.cart.push({id, q});
    return renderCaixa();
  }
  if (act === 'cart-del') { S.cart = S.cart.filter(i => i.id !== d.id); return renderCaixa(); }
  if (act === 'cart-fin') {
    return run(async () => {
      await api('/api/admin/sales', {items: S.cart.map(i => ({product: i.id, quantidade: i.q})), method: $('#cf').value, barbeiro: $('#cv').value});
      S.cart = [];
    }, 'Venda registrada');
  }
  if (act === 'msg-cli' || act === 'msg-bar') {
    const a = (S.agendaList || []).find(x => x.codigo === d.code); if (!a) return;
    return abrirMensagem(act === 'msg-cli' ? {para: 'cliente', nome: a.cliente, tel: a.telefone, barbeiroId: a.barbeiro_id, appt: a, data: S.day}
                                           : {para: 'barbeiro', nome: a.barbeiro, barbeiroId: a.barbeiro_id, appt: a, data: S.day});
  }
  if (act === 'm-bar') return abrirMensagem({para: 'barbeiro', barbeiroId: d.id});
  if (act === 'm-cli') { const u = (S.users || []).find(x => x.id === d.id); return u ? abrirMensagem({para: 'cliente', nome: u.nome, tel: u.telefone}) : undefined; }
  if (act === 'deltx' && confirm('Excluir este lançamento? Não dá para desfazer.'))
    return run(() => api('/api/admin/transactions/' + encodeURIComponent(d.id) + '/delete', {}), 'Lançamento excluído');
  if (act === 'newtx') return newTx();
  if (act === 'edittx') return editTx(d.id);
  if (act === 'newprod') { const v = await ask({title: 'Novo produto', fields: prodFields, values: {ativo: true, estoque_minimo: 3}}); if (v) run(() => api('/api/admin/products', v), 'Produto criado'); }
  if (act === 'editprod') { const p = S.prod.find(x => x.id === d.id), v = await ask({title: 'Editar produto', fields: prodFields, values: {...p, ativo: p.ativo}}); if (v) run(() => api('/api/admin/products', {...v, id: d.id}), 'Produto atualizado'); }
  if (act === 'mov') {
    const p = S.prod.find(x => x.id === d.id), nomeT = {entrada: 'Entrada', saida: 'Saída', ajuste: 'Ajuste'}[d.t];
    const v = await ask({title: `${nomeT} · ${p.nome}`, fields: [
      {k: 'quantidade', label: d.t === 'ajuste' ? 'Quantidade (pode ser negativa)' : 'Quantidade', type: 'number', step: '1', req: true, ...(d.t === 'ajuste' ? {} : {min: 1})},
      {k: 'motivo', label: 'Motivo (opcional)', max: 80}]});
    if (v) run(() => api('/api/admin/stock', {product: d.id, tipo: d.t, ...v}), 'Estoque atualizado');
  }
  if (act === 'sell') {
    const p = S.prod.find(x => x.id === d.id), bs = await barbers();
    const v = await ask({title: `Venda · ${p.nome} (${brl(p.preco)})`, ok: 'Vender', values: {quantidade: 1, method: 'pix'}, fields: [
      {k: 'quantidade', label: 'Quantidade', type: 'number', step: '1', min: 1, req: true},
      {k: 'method', label: 'Forma de pagamento', type: 'select', opts: Object.entries(FORMAS)},
      {k: 'barbeiro', label: 'Vendido por (opcional)', type: 'select', opts: [['', '—']].concat(bs.filter(x => x.ativo).map(x => [x.nome, x.nome]))}]});
    if (v) run(() => api('/api/admin/sales', {product: d.id, ...v}), 'Venda registrada');
  }
  if (act === 'newserv') { const v = await ask({title: 'Novo serviço', fields: servFields, values: {ativo: true, minutos: 30}}); if (v) run(() => api('/api/admin/services', v), 'Serviço criado'); }
  if (act === 'editserv') { const s = S.serv.find(x => x.id === d.id), v = await ask({title: 'Editar serviço', fields: servFields, values: s}); if (v) run(() => api('/api/admin/services', {...v, id: d.id}), 'Serviço atualizado'); }
  if (act === 'newbarb') { const v = await ask({title: 'Novo barbeiro', fields: barbFields, values: {ativo: true}}); if (v) run(() => api('/api/admin/barbers', v), 'Barbeiro criado'); }
  if (act === 'editbarb') { const x = (await barbers()).find(y => y.id === d.id), v = await ask({title: 'Editar barbeiro', fields: barbFields, values: {...x, telefone: fmtTel(x.telefone)}}); if (v) run(() => api('/api/admin/barbers', {...v, id: d.id}), 'Barbeiro atualizado'); }
  if (act === 'savehours') {
    const days = Array.from({length: 7}, () => ({}));
    view.querySelectorAll('.hrs input').forEach(i => days[+i.dataset.i][i.dataset.k] = i.value);
    run(() => api('/api/admin/hours', {barber: S.hb || '*', days}), 'Horários salvos');
  }
  if (act === 'newoff') {
    const bs = await barbers();
    const v = await ask({title: 'Nova folga / bloqueio', fields: [
      {k: 'barbeiro', label: 'Quem', type: 'select', opts: [['*', 'Todos (feriado, férias coletivas)']].concat(bs.filter(x => x.ativo).map(x => [x.id, x.nome]))},
      {k: 'data', label: 'Data', type: 'date', req: true}, {k: 'inicio', label: 'Das (vazio = dia todo)', type: 'time'}, {k: 'fim', label: 'Até', type: 'time'},
      {k: 'motivo', label: 'Motivo', max: 80}]});
    if (v) run(() => api('/api/admin/timeoff', v), 'Folga cadastrada');
  }
  if (act === 'deloff' && confirm('Remover esta folga? O horário volta a ser oferecido no site.')) run(() => api('/api/admin/timeoff/delete', {row: +d.row, data: d.d}), 'Folga removida');
});
view.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'qusers') return;
  if (t.id === 'dayin' && t.value) { S.day = t.value; show('agenda'); }
  if (t.id === 'monthin' && t.value) { S.month = t.value; show(S.tab); }
  if (t.id === 'nofi') { S.noForma = t.checked; show('lanc'); }
  if (t.id === 'hb') { S.hb = t.value; show('horarios'); }
});
view.addEventListener('input', e => { if (e.target.id === 'qusers') renderUsuarios(); if (e.target.id === 'qmsg') renderMsgClientes(); });
view.addEventListener('keydown', e => {  // Enter na quantidade adiciona ao carrinho
  if (e.key === 'Enter' && e.target.id === 'cq') { e.preventDefault(); document.querySelector('[data-act="cart-add"]').click(); }
});
view.addEventListener('submit', e => {
  if (e.target.id === 'f-desp') {
    e.preventDefault();
    const desc = $('#dd').value.trim(), valor = parseFloat($('#dv').value), rep = Math.max(1, parseInt($('#dr').value, 10) || 1);
    if (!desc) return toast('Informe a descrição da despesa.', true);
    if (!(valor > 0)) return toast('Informe o valor da despesa.', true);
    if (!$('#dt').value) return toast('Informe a data.', true);
    run(() => api('/api/admin/transactions', {tipo: 'despesa', data: $('#dt').value, descricao: desc, valor, categoria: $('#dc').value, forma_pgto: $('#df').value, repetir: rep}),
        rep > 1 ? `${rep} despesas registradas` : 'Despesa registrada');
    return;
  }
  if (e.target.id !== 'siteform') return;
  e.preventDefault();
  run(() => api('/api/admin/config', Object.fromEntries(new FormData(e.target))), 'Dados do site salvos');
});

// ------------------------------------------------------------ início
(async () => {
  try {
    S.links = await api('/api/admin/links');
    [['l-fin', 'financeiro'], ['l-est', 'estoque'], ['l-age', 'agenda']].forEach(([id, k]) => { if (S.links[k]) { const a = $('#' + id); a.href = S.links[k]; a.hidden = false; } });
  } catch (e) { /* atalhos são opcionais */ }
  const t = location.hash.slice(1);
  show(LOAD[t] ? t : 'agenda');
})();
</script>
